<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой TODO лист</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="todo-container">
        <h1>📋 TODO лист</h1>
        
        <div class="input-section">
            <input type="text" id="taskInput" placeholder="Что нужно сделать?" autocomplete="off">
            <button id="addBtn">+</button>
        </div>

        <div class="stats">
            <div>Всего задач: <span id="totalTasks">0</span></div>
            <div>Выполнено: <span id="completedTasks">0</span></div>
        </div>

        <div class="filter-buttons">
            <button class="filter-btn active" data-filter="all">Все</button>
            <button class="filter-btn" data-filter="active">Активные</button>
            <button class="filter-btn" data-filter="completed">Выполненные</button>
        </div>

        <ul id="todoList">
            <!-- Сюда будут добавляться задачи -->
        </ul>

        <button class="clear-completed" id="clearCompleted">Очистить выполненные</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
