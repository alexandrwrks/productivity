services:
  db:
    image: postgres:16-alpine
    container_name: productivity_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-world_news_bot}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgre123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-world_news_bot}"]
      interval: 5s
      timeout: 5s
      retries: 10

  bot:
    build: .
    container_name: productivity_bot
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgre123}@db:5432/${POSTGRES_DB:-world_news_bot}
      SYNC_DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgre123}@db:5432/${POSTGRES_DB:-world_news_bot}
    volumes:
      - ./api.log:/app/api.log

volumes:
  postgres_data:
