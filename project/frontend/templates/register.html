<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Регистрация</title>
    <link rel="stylesheet" href="/static/auth.css">
</head>
<body>
    <div class="container">
        <!-- Переключатель между страницами -->
        <div class="auth-switch">
            <a href="/register" class="switch-link active">Регистрация</a>
            <span class="separator">/</span>
            <a href="/login" class="switch-link">Авторизация</a>
        </div>
        
        <!-- Форма регистрации -->
        <form action="/register" method="post" class="auth-form">
            <div class="form-group">
                <label for="name">Имя:</label>
                <input type="text" name="name" id="name" class="form-input" placeholder="Введите имя" required>
            </div>

            <div class="form-group">
                <label for="email">Почта:</label>
                <input type="email" name="email" id="email" class="form-input" placeholder="Введите почту" required>
            </div>

            <div class="form-group">
                <label for="password">Пароль:</label>
                <input type="password" name="password" id="password" class="form-input" placeholder="Придумайте пароль" required>
            </div>

            <button type="submit" class="auth-button">
                Зарегистрироваться
            </button>
        </form>
    </div>
</body>
</html>
