<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="/static/login.css" 
</head>
<body>
    <div class="container">
        <div>
            <a href="/templates/register.html">Регистрация</a>
            <span>/</span>
            <a href="/templates/login.html">Авторизация</a>
        </div>

        <form>
            <div class="form-group">
                <label for="email">Почта:</label>
                <input type="email" name="email" id="email" class="form-input" placeholder="Введите почту" required>
            </div>

            <div class="form-group">
                <label for="password">Пароль:</label>
                <input type="password" name="password" id="password" class="form-input" placeholder="Придумайте пароль" required>
            </div>

            <button type="submit" class="auth-button">
                Аторизоваться
            </button>
        </form>

    </div>


</body>
</html>
