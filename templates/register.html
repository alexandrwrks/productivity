<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация</title>
    <link rel="stylesheet" href="/static/reg.css">
</head>
<body>
    <h1>Регистрация</h1>
    
    {% if error %}
    <div style="color: red; background-color: #ffeeee; padding: 10px; margin: 10px 0; border: 1px solid red;">
        {{ error }}
    </div>
    {% endif %}
    
    <form method="post" action="/register">
        <div>
            <label for="name">Имя:</label>
            <input type="text" id="name" name="name" value="{{ data.name if data else '' }}" required>
        </div>
        
        <div>
            <label for="surname">Фамилия:</label>
            <input type="text" id="surname" name="surname" value="{{ data.surname if data else '' }}" required>
        </div>
        
        <div>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" value="{{ data.email if data else '' }}" required>
        </div>
        
        <div>
            <label for="password">Пароль:</label>
            <input type="password" id="password" name="password" required>
            <!-- <small>Пароль должен содержать минимум 8 символов, включая заглавные и строчные буквы, цифры и спецсимволы</small> -->
        </div>
        
        <div>
            <label for="reply_password">Подтверждение пароля:</label>
            <input type="password" id="reply_password" name="reply_password" required>
        </div>
        
        <div>
            <button type="submit">Зарегистрироваться</button>
        </div>
    </form>
    
    <p>Уже есть аккаунт? <a href="/login">Войти</a></p>
</body>
</html>
